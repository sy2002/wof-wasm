<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wings of Fury</title>
<link rel="icon" href="data:,">
<style>@@WOF_CSS@@</style>
</head>
<body>
<!-- The pause sign, shown while the game is paused (web/video.js lays it out on the picture). -->
<div id="stage"><canvas id="screen"></canvas><div id="paused" class="off"><div class="title">PAUSED</div><div class="continue">Press P to continue</div></div></div>
<div id="gesture">press any key for sound</div>
<div id="overlay" class="off"></div>
<!-- The diagnostics key is named by where it is, not by the character on it: the shell
     tests event.code Backquote, which is positional, and that key carries a caret on a
     German keyboard and other characters elsewhere. -->
<div id="hint">arrows and Return choose &middot; P pause &middot; F flip the stick &middot; key left of 1: diagnostics</div>

<!-- The core and the game's files, inlined by tools/build.py.  These are not scripts: the
     type keeps the browser from running them, the shell reads them as text and decodes. -->
<script id="wof-wasm" type="text/wof-base64">@@WOF_WASM_BASE64@@</script>
<script id="wof-fs" type="text/wof-base64">@@WOF_FS_BASE64@@</script>

<script>@@WOF_JS@@</script>
</body>
</html>
