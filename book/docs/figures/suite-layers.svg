<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562" role="img" aria-labelledby="title desc">
  <title id="title">The layers of the suite</title>
  <desc id="desc">Seven rows, one a layer of the suite, from one routine at the top to the page at the bottom, each with what it compares, against what, and the chapter that told its instrument. One routine: results, flags and touched memory on random inputs, against the original under the emulator, the ROM's floating point and the blitter model; chapters 5 and 12. The original observed: the instrument's claims, the notes' findings and each key with and without, against the headless original itself; chapters 6 and 19. The front end: files, music and drawing calls VBlank by VBlank, against the headless original's run; chapter 19. The missions: state, drawing, chance, palettes and sound after every pass and tick, against the original's recording in two loops; chapters 8 and 18. The whole game replayed: the state's hash after every input sample in both builds, against the hashes stored with the demo; chapter 17. The core itself: both builds, save states, the page file and the generated files, against the other build and the repository; chapter 22. The page: pixels, box, clock, sound, saves, pause and fullscreen, against the framebuffer and the clock the core gave the shell; chapter 23. A dashed frame round the first six rows is the emulator phase, over the processor cores; a second round the page is the page phase, alone after the emulator phase. The first four layers are held against the original, the next two against the port's own record, the page against what the core gave the browser.</desc>
  <style>
    /* The design's colours, each an entry of one of the game's palettes. */
    .orig  { fill: #77AACC; /* wingspalette 22 */ }
    .own   { fill: #CCCCDD; /* wingspalette 30 */ }
    .page  { fill: #FFBB00; /* wingstitle 25 */ }
    .ink   { fill: #111122; /* wingspalette 6 */ }
    .light { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted { fill: #AAAABB; /* wingspalette 29 */ }
    .ground { fill: #000000; /* wingspalette 0 */ }
    .rule  { stroke: #444455; /* wingspalette 26 */ stroke-width: 1; }
    .frame { stroke: #888899; /* wingspalette 28 */ stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
