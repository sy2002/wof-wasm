<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title desc">
  <title id="title">A bomb and a rocket, a dot a tick</title>
  <desc id="desc">Left: a bomb dropped in level flight at 14 pixels a tick, starting where the aircraft is drawn, a dot for each tick from the drop to the ground. Each tick it loses a tenth of its horizontal speed, none once that is below ten pixels a tick, and gravity takes three eighths of a pixel a tick off its vertical speed, so it falls in a curve and comes down behind the aircraft, which flies on. It comes down 12 pixels above the water line, 0x0C, over the sea, the land and the targets alike. Right: two rockets. Fired in level flight, a rocket keeps the aircraft&#39;s speed and falls a pixel back and a pixel down each tick until a count of 4, 8 or 12 ticks, drawn from the beam, runs out; then its thrust along the bearing adds to its speed every tick and it flies on level, faster and faster, until it is more than 0x500 pixels from the aircraft and its record is freed. Fired in a dive of 20 degrees, the thrust along the dive brings it down onto the ground. As its fall ends, a rocket that points down is aimed at the first ship&#39;s gun or pillbox within its bearing&#39;s reach, if one stands there. The heights are drawn 1.6 times as tall as the x.</desc>
  <style>
    /* The book's colours (stylesheets/book.css) and the game's, each an entry of one of its palettes. */
    .sea    { fill: #0033DD; /* wingspalette 5 */ }
    .land   { fill: #DD9966; /* wingspalette 17 */ }
    .gold   { fill: #FFBB00; /* wingstitle 25 */ }
    .fast   { fill: #666677; /* wingspalette 27 */ }
    .rule   { fill: #AAAABB; /* wingspalette 29 */ }
    .plane  { fill: #CCCCDD; /* wingspalette 30 */ }
    .light  { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted  { fill: #AAAABB; /* wingspalette 29 */ }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <text class="light label" x="10" y="22">A bomb and a rocket, a dot a tick</text>

  <!-- The ground, 0x0C above the water line, and the sea, under both panels -->
  <rect class="land" x="20" y="330.8" width="460" height="19.2"/>
  <rect class="sea" x="20" y="350.0" width="460" height="16"/>
  <rect class="land" x="520" y="330.8" width="440" height="19.2"/>
  <rect class="sea" x="520" y="350.0" width="440" height="16"/>
  <text class="light small" x="24" y="384.0">the water line, and 0x0C, 12 pixels above it: where a weapon</text>
  <text class="muted small" x="24" y="400.0">comes down over the sea, the land and the targets alike</text>

