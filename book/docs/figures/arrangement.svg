<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="title desc">
  <title id="title">The arrangement</title>
  <desc id="desc">At the top, the owner, who has one chat and opens every session. Below, the controller, one session: the owner hands it decisions and findings from the eyes and the ears, and it asks the owner, each ask with a recommendation. To its left a worker, a session doing its task on its branch: the controller sends it the task as one message and gets its report, a claim, back. Above that worker, two more workers, idle, opened in advance. To the right, the previous controller, whose context is filling, hands the lead to the controller at a quiet point by a message. At the bottom, the repository in one working directory, the handover, holding the code, the notes, the specification and the rules: the main branch, and one task branch out at a time, on which the worker commits; the controller merges it into main after its review and rebuilds the page; the previous controller has written everything down there.</desc>
  <style>
    /* The book's colours (stylesheets/book.css), each an entry of one of the game's palettes. */
    .owner  { fill: #FFBB00; /* wingstitle 25 */ }
    .ctrl   { fill: #77AACC; /* wingspalette 22 */ }
    .work   { fill: #44AA44; /* iff-dash 6 */ }
    .repo   { fill: #CCCCDD; /* wingspalette 30 */ }
    .ink    { fill: #111122; /* wingspalette 6 */ }
    .light  { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted  { fill: #AAAABB; /* wingspalette 29 */ }
    .frame  { stroke: #888899; /* wingspalette 28 */ stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .wire   { stroke: #EEEEEE; /* wingstitle 31 */ stroke-width: 2; fill: none; }
    .tctrl  { stroke: #77AACC; /* wingspalette 22 */ stroke-width: 2; fill: none; }
    .twork  { stroke: #44AA44; /* iff-dash 6 */ stroke-width: 2; fill: none; }
    .tdown  { stroke: #AAAABB; /* wingspalette 29 */ stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .main   { stroke: #111122; /* wingspalette 6 */ stroke-width: 3; fill: none; }
    .branch { stroke: #44AA44; /* iff-dash 6 */ stroke-width: 3; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>

  <!-- The owner, at the top: one chat, with the controller alone -->
  <rect class="owner" x="345" y="14" width="170" height="72" rx="4"/>
  <text class="ink label" x="430" y="38" text-anchor="middle">the owner</text>
  <text class="ink small" x="430" y="57" text-anchor="middle">one chat,</text>
  <text class="ink small" x="430" y="73" text-anchor="middle">opens every session</text>
  <path class="wire" d="M410 90 L410.0 155.0"/>
  <path class="light" d="M410 166 L404.5 155.0 L415.5 155.0 Z"/>
  <text class="light small" x="400" y="118" text-anchor="end">decisions, findings,</text>
  <text class="light small" x="400" y="133" text-anchor="end">eyes and ears</text>
  <path class="wire" d="M450 166 L450.0 101.0"/>
  <path class="light" d="M450 90 L455.5 101.0 L444.5 101.0 Z"/>
  <text class="light small" x="460" y="118">asks, each with</text>
  <text class="light small" x="460" y="133">a recommendation</text>

  <!-- The controller, in the middle -->
  <rect class="ctrl" x="345" y="170" width="170" height="70" rx="4"/>
  <text class="ink label" x="430" y="199" text-anchor="middle">the controller</text>
  <text class="ink small" x="430" y="219" text-anchor="middle">reviews, merges, asks</text>

  <!-- The workers, on the left: one with its task, two idle, opened in advance -->
  <text class="muted small" x="120" y="52" text-anchor="middle">opened in advance</text>
  <rect class="frame" x="40" y="62" width="160" height="30" rx="4"/>
  <text class="light small" x="120" y="82" text-anchor="middle">a worker, idle</text>
  <rect class="frame" x="40" y="102" width="160" height="30" rx="4"/>
  <text class="light small" x="120" y="122" text-anchor="middle">a worker, idle</text>
  <rect class="work" x="40" y="170" width="160" height="70" rx="4"/>
  <text class="ink label" x="120" y="199" text-anchor="middle">a worker</text>
  <text class="ink small" x="120" y="219" text-anchor="middle">its task, on its branch</text>
  <path class="wire" d="M341 192 L215.0 192.0"/>
  <path class="light" d="M204 192 L215.0 186.5 L215.0 197.5 Z"/>
  <text class="light small" x="272" y="183" text-anchor="middle">a task, one message</text>
  <path class="wire" d="M204 220 L330.0 220.0"/>
  <path class="light" d="M341 220 L330.0 225.5 L330.0 214.5 Z"/>
  <text class="light small" x="272" y="238" text-anchor="middle">its report, a claim</text>

  <!-- The previous controller, on the right: the handover at a quiet point -->
  <rect class="frame" x="660" y="170" width="170" height="70" rx="4"/>
  <text class="light label" x="745" y="193" text-anchor="middle">the previous</text>
  <text class="light label" x="745" y="211" text-anchor="middle">controller</text>
  <text class="light small" x="745" y="229" text-anchor="middle">its context filling</text>
  <path class="wire" d="M656 205 L530.0 205.0"/>
  <path class="light" d="M519 205 L530.0 199.5 L530.0 210.5 Z"/>
  <text class="light small" x="588" y="196" text-anchor="middle">the handover</text>
  <text class="light small" x="588" y="223" text-anchor="middle">a message,</text>
  <text class="light small" x="588" y="238" text-anchor="middle">at a quiet point</text>

  <!-- The repository: one working directory, main and one task branch, its name and what it holds below them -->
  <rect class="repo" x="20" y="316" width="820" height="170" rx="4"/>
  <path class="main" d="M40 410 L820 410"/>
  <text class="ink small" x="40" y="400">main</text>
  <path class="branch" d="M180 410 L220 372 L420 372 L460 410"/>
  <circle class="ink" cx="100" cy="410" r="6"/>
  <circle class="ink" cx="150" cy="410" r="6"/>
  <circle class="ink" cx="460" cy="410" r="6"/>
  <circle class="ink" cx="560" cy="410" r="6"/>
  <circle class="ink" cx="740" cy="410" r="6"/>
  <circle class="ink" cx="800" cy="410" r="6"/>
  <circle class="work" cx="260" cy="372" r="6"/>
  <circle class="work" cx="330" cy="372" r="6"/>
  <circle class="work" cx="400" cy="372" r="6"/>
  <text class="ink small" x="320" y="394" text-anchor="middle">one task branch out at a time</text>
  <text class="ink label" x="40" y="450">the repository, in one working directory</text>
  <text class="ink small" x="40" y="470">the handover: the code, the notes, the specification and the rules</text>

  <!-- Into the repository: the worker commits on its branch, the controller merges, the previous controller wrote everything down -->
  <path class="twork" d="M150 246 L313.9 355.9"/>
  <path class="work" d="M323 362 L310.8 360.4 L316.9 351.3 Z"/>
  <text class="light small" x="200" y="296" text-anchor="end">commits on</text>
  <text class="light small" x="200" y="310" text-anchor="end">its branch</text>
  <path class="tctrl" d="M440 246 L456.7 389.1"/>
  <path class="ctrl" d="M458 400 L451.3 389.7 L462.2 388.4 Z"/>
  <text class="light small" x="462" y="282">merges after its review,</text>
  <text class="light small" x="462" y="296">rebuilds the page</text>
  <path class="tdown" d="M740 246 L740.0 389.0"/>
  <path class="muted" d="M740 400 L734.5 389.0 L745.5 389.0 Z"/>
  <text class="light small" x="750" y="282">everything</text>
  <text class="light small" x="750" y="296">written down</text>
</svg>
