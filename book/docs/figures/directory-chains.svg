<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 714" width="1000" height="714" role="img" aria-labelledby="title desc">
  <title id="title">The directory&#39;s hash chains</title>
  <desc id="desc">The game&#39;s directory on the disk as the file system keeps it: 72 hash chains, drawn as a grid of six columns read row by row, chain 0 at the top left and chain 71 at the bottom right. Each entry lies in the chain its name&#39;s hash gives, and ExNext hands the entries out chain by chain, upward, each chain from its head: Wings in chain 1, wingt 2, .info 7, shapes 22, wofsongs 26, wings.info 32, maps 33, sounds 42, UFXintro 43, highscore 49, songplay and then newarmyfont in chain 53, rank.iff.info 58 and the saved game wof.mission 3 in chain 64, numbered in that order. A game saved under the example name wof.flight 4 also falls in chain 64; the harness and the port put it at the head, before wof.mission 3, where a real file system is documented to put a new entry; that a real Kickstart 1.3 does so, and walks the chains in this order, nothing has confirmed. The load and save dialog lists only the names that begin with wof.</desc>
  <style>
    /* The book's colours (stylesheets/book.css) and the game's, each an entry of one of its palettes. */
    .disk   { fill: #CCCCDD; /* wingspalette 30 */ }
    .saved  { fill: #44AA44; /* iff-dash 6 */ }
    .empty  { fill: #111122; /* wingspalette 6 */ stroke: #AAAABB; /* wingspalette 29 */ stroke-width: 1; }
    .listed { fill: none; stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 3; }
    .open   { fill: none; stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 2; stroke-dasharray: 6 4; }
    .ink    { fill: #111122; /* wingspalette 6 */ }
    .light  { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted  { fill: #AAAABB; /* wingspalette 29 */ }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label { font-size: 15px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; }
    .code  { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
    .tiny  { font-size: 11px; }
  </style>
