  <rect class="cellB" x="296" y="250" width="8" height="14"/>
  <rect class="cellA" x="304" y="250" width="8" height="14"/>
  <rect class="cellB" x="312" y="250" width="8" height="14"/>
  <rect class="cellA" x="320" y="250" width="8" height="14"/>
  <rect class="cellB" x="328" y="250" width="8" height="14"/>
  <rect class="cellA" x="336" y="250" width="8" height="14"/>
  <rect class="cellB" x="344" y="250" width="8" height="14"/>
  <rect class="cellA" x="352" y="250" width="8" height="14"/>
  <rect class="cellB" x="360" y="250" width="8" height="14"/>
