  <rect class="cellA" x="592" y="250" width="8" height="14"/>
  <rect class="cellB" x="600" y="250" width="8" height="14"/>
  <rect class="cellA" x="608" y="250" width="8" height="14"/>
  <rect class="cellB" x="616" y="250" width="8" height="14"/>
  <rect class="cellA" x="624" y="250" width="8" height="14"/>
  <rect class="cellB" x="632" y="250" width="8" height="14"/>
  <rect class="cellA" x="640" y="250" width="8" height="14"/>
  <rect class="cellB" x="648" y="250" width="8" height="14"/>
  <text class="light small" x="72" y="244">the map's records, 8 pixels each</text>

  <!-- The window: what a pass draws -->
  <rect class="gold" x="72" y="272" width="576" height="2"/>
  <rect class="gold" x="72" y="266" width="2" height="12"/>
  <rect class="gold" x="647" y="266" width="2" height="12"/>
  <text class="light small" x="72" y="294">screen x &#8722;128</text>
  <text class="light small" x="648" y="294" text-anchor="middle">448</text>
  <text class="light small" x="360" y="294" text-anchor="middle">the records a pass draws, and every shape</text>

  <!-- 288 pixels from the first record to the aircraft -->
  <rect class="rule" x="80" y="322" width="272" height="1"/>
  <path class="rule" d="M72 322.5 L81 318 L81 327 Z"/>
  <path class="rule" d="M360 322.5 L351 318 L351 327 Z"/>
  <text class="muted small" x="216" y="314" text-anchor="middle">288 pixels: the first record is (x &#8722; 288) / 8</text>
  <text class="muted small" x="216" y="344" text-anchor="middle">x the aircraft's world x</text>
</svg>
