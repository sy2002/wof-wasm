  <rect class="cellB" x="504" y="250" width="8" height="14"/>
  <rect class="cellA" x="512" y="250" width="8" height="14"/>
  <rect class="cellB" x="520" y="250" width="8" height="14"/>
  <rect class="cellA" x="528" y="250" width="8" height="14"/>
