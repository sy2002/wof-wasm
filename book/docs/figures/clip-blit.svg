  <rect class="zero" x="792" y="172" width="11" height="26"/>
  <!-- What blanks each stretch of A -->
  <polyline class="brace" points="181,206 181,212 244,212 244,206"/>
  <text class="muted small" x="212" y="227" text-anchor="middle">shift 5:</text>
  <text class="muted small" x="212" y="241" text-anchor="middle">zeros</text>
  <polyline class="brace" points="246,206 246,212 387,212 387,206"/>
  <text class="muted small" x="316" y="227" text-anchor="middle">first word mask</text>
  <text class="muted small" x="316" y="241" text-anchor="middle">0x001F</text>
  <polyline class="brace" points="389,206 389,212 660,212 660,206"/>
  <text class="light small" x="524" y="227" text-anchor="middle">the mask: set</text>
  <text class="light small" x="524" y="241" text-anchor="middle">across the box</text>
  <polyline class="brace" points="662,206 662,212 803,212 803,206"/>
  <text class="muted small" x="732" y="227" text-anchor="middle">last word mask</text>
  <text class="muted small" x="732" y="241" text-anchor="middle">0x0000</text>
  <!-- D, the screen's row: written where A is 1, kept where it is 0 -->
  <text class="light" x="10" y="282">the screen's row</text>
