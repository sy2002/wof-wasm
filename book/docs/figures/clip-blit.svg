  <!-- The clip's edge through the rows -->
  <line class="edge" x1="388" y1="92" x2="388" y2="300"/>
  <!-- The rule -->
  <text class="light" x="10" y="350">With the logic function <tspan class="mono">0xCA</tspan>, D = A and B, or not A and C: where A is 0, the screen keeps its own bit.</text>
  <text class="light" x="10" y="372">So the pixels written are the shape's box inside the clip, and no other, wherever the shape lies.</text>
</svg>
