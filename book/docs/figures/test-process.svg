<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 344" width="1000" height="344" role="img" aria-labelledby="title desc">
  <title id="title">A test process's life</title>
  <desc id="desc">On the left, the collection: the hook gives the loop tests of one script's recording one group, and a group goes whole to one test process. From it, two lanes, one a test process, each with three steps in order. First the build, once: test process 1, the first to take the lock, builds and leaves a file to say so; test process 2 takes the lock after it, finds the file and does not build. Between them the directory all test processes share, holding the lock and the file, joined to both builds. Then before each test that takes the core: the settings back and a fresh core. Then a loop test: its script's recording, kept in the test process, made once there under the headless original. Below, and so on, one test process for each processor core.</desc>
  <style>
    /* The design's colours, each an entry of one of the game's palettes. */
    .once   { fill: #FFBB00; /* wingstitle 25 */ }
    .fresh  { fill: #77AACC; /* wingspalette 22 */ }
    .made   { fill: #CCCCDD; /* wingspalette 30 */ }
    .own    { fill: #AAAABB; /* wingspalette 29 */ }
    .shared { fill: #888899; /* wingspalette 28 */ }
    .ink    { fill: #111122; /* wingspalette 6 */ }
    .light  { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted  { fill: #AAAABB; /* wingspalette 29 */ }
    .wire   { stroke: #EEEEEE; /* wingstitle 31 */ stroke-width: 1.5; fill: none; }
    .link   { stroke: #888899; /* wingspalette 28 */ stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .tip    { fill: #EEEEEE; /* wingstitle 31 */ }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label  { font-size: 14px; font-weight: 700; }
    .small  { font-size: 12px; }
  </style>
