  <text class="ink small" x="26" y="186">recording one group;</text>
  <text class="ink small" x="26" y="202">a group goes whole to</text>
  <text class="ink small" x="26" y="218">one test process</text>
  <text class="light label" x="252" y="34">test process 1</text>
  <rect class="once" x="252" y="44" width="196" height="80" rx="3"/>
  <text class="ink label" x="262" y="64">the build, once</text>
  <text class="ink small" x="262" y="82">the first to take the lock:</text>
  <text class="ink small" x="262" y="98">builds, leaves a file to say so</text>
  <rect class="fresh" x="468" y="44" width="206" height="80" rx="3"/>
  <text class="ink label" x="478" y="64">before each test</text>
  <text class="ink small" x="478" y="82">that takes the core: the</text>
  <text class="ink small" x="478" y="98">settings back, a fresh core</text>
  <rect class="made" x="694" y="44" width="216" height="80" rx="3"/>
  <text class="ink label" x="704" y="64">a loop test</text>
  <text class="ink small" x="704" y="82">its script's recording, kept in</text>
  <text class="ink small" x="704" y="98">the process, made once there</text>
  <path class="wire" d="M448 84.0 L458 84.0"/>
  <path class="tip" d="M458 79.0 L458 89.0 L468 84.0 Z"/>
  <path class="wire" d="M674 84.0 L684 84.0"/>
  <path class="tip" d="M684 79.0 L684 89.0 L694 84.0 Z"/>
  <text class="light label" x="252" y="210">test process 2</text>
  <rect class="once" x="252" y="220" width="196" height="80" rx="3"/>
  <text class="ink label" x="262" y="240">the build, once</text>
  <text class="ink small" x="262" y="258">takes the lock after it:</text>
  <text class="ink small" x="262" y="274">finds the file, does not build</text>
  <rect class="fresh" x="468" y="220" width="206" height="80" rx="3"/>
  <text class="ink label" x="478" y="240">before each test</text>
  <text class="ink small" x="478" y="258">that takes the core: the</text>
