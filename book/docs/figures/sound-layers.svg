<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Two layers, one sound</title>
  <desc id="desc">The lift's clang, a sample played once on channel 3, on a ruler of VBlanks. In the logic tick of the pass after VBlank k the clang's setter fills sound slot 7, and sound_channels calls channel_play three times, which leaves the channel record waiting and stamped with the count k. At VBlank k + 1 the sound effects engine's VBlank server finds one VBlank since the stamp and waits. At VBlank k + 2 it finds two, writes the channel's address, length, period and volume and switches the channel on with its one write of DMACON. Paula plays the sample's one cycle from there, raising an interrupt request at the start and again at the cycle's end. The handler audio_irq answers each: at the start the repeat count goes from 1 to 0 and the channel plays on; at the end it goes to −1 and the handler stops the channel, its DMA and its interrupt bit off.</desc>
  <style>
    /* The book's colours (stylesheets/book.css), each an entry of one of the game's palettes. */
    .tick   { fill: #FFBB00; /* wingstitle 25 */ }
    .server { fill: #CCCCDD; /* wingspalette 30 */ }
    .paula  { fill: #77AACC; /* wingspalette 22 */ }
    .irq    { fill: #EE6622; /* wingspalette 2 */ }
    .ink    { fill: #111122; /* wingspalette 6 */ }
    .light  { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted  { fill: #AAAABB; /* wingspalette 29 */ }
    .vblank { stroke: #666677; /* wingspalette 27 */ stroke-width: 1; stroke-dasharray: 3 3; }
    .wire   { stroke: #EEEEEE; /* wingstitle 31 */ stroke-width: 1.5; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; }
    .label { font-size: 15px; font-weight: 700; }
    .name  { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <text class="light label" x="16" y="26">Two layers, one sound</text>
  <text class="muted small" x="16" y="46">the lift's clang, a one-shot on channel 3</text>

  <!-- The VBlanks: k at x = 220, 160 apart; a break, then the instant the cycle ends -->
  <text class="light" x="220" y="76" text-anchor="middle">VBlank k</text>
  <text class="light" x="380" y="76" text-anchor="middle">k + 1</text>
  <text class="light" x="540" y="76" text-anchor="middle">k + 2</text>
  <text class="light" x="700" y="76" text-anchor="middle">k + 3</text>
  <text class="light" x="840" y="76" text-anchor="middle">the cycle's end</text>
  <line class="vblank" x1="220" y1="84" x2="220" y2="420"/>
  <line class="vblank" x1="380" y1="84" x2="380" y2="420"/>
  <line class="vblank" x1="540" y1="84" x2="540" y2="420"/>
  <line class="vblank" x1="700" y1="84" x2="700" y2="420"/>
  <line class="vblank" x1="840" y1="84" x2="840" y2="420"/>
  <text class="muted" x="760" y="76" text-anchor="middle">…</text>

  <!-- Row 1: the logic tick -->
  <text class="light name" x="16" y="112">the logic tick</text>
  <text class="muted small" x="16" y="128">in the pass after VBlank k</text>
  <rect class="tick" x="228" y="94" width="144" height="70" rx="3"/>
  <text class="ink small" x="300" y="110" text-anchor="middle">the clang's setter</text>
  <text class="ink small" x="300" y="125" text-anchor="middle">fills sound slot 7;</text>
  <text class="ink small" x="300" y="140" text-anchor="middle">channel_play x 3</text>
  <text class="ink small" x="300" y="155" text-anchor="middle">stamps the record: k</text>

  <!-- Row 2: the engine's VBlank server -->
  <text class="light name" x="16" y="200">soundfx_vblank</text>
  <text class="muted small" x="16" y="216">the VBlank server</text>
  <rect class="server" x="388" y="182" width="144" height="56" rx="3"/>
  <text class="ink small" x="460" y="200" text-anchor="middle">one VBlank since</text>
  <text class="ink small" x="460" y="215" text-anchor="middle">the stamp:</text>
  <text class="ink small" x="460" y="230" text-anchor="middle">it waits</text>
  <rect class="server" x="548" y="182" width="144" height="56" rx="3"/>
  <text class="ink small" x="620" y="200" text-anchor="middle">two: LC, LEN,</text>
  <text class="ink small" x="620" y="215" text-anchor="middle">PER, VOL, then</text>
  <text class="ink small" x="620" y="230" text-anchor="middle">one DMACON write</text>

  <!-- Row 3: Paula's channel 3, one cycle, a request at its start and at its end -->
  <text class="light name" x="16" y="282">Paula, channel 3</text>
  <text class="muted small" x="16" y="298">one cycle of the sample</text>
  <rect class="paula" x="540" y="270" width="210" height="28"/>
  <rect class="paula" x="770" y="270" width="70" height="28"/>
  <text class="ink small" x="645" y="288" text-anchor="middle">the clang plays</text>
  <path class="irq" d="M532 256 L548 256 L540 268 Z"/>
  <path class="irq" d="M832 256 L848 256 L840 268 Z"/>
  <text class="light small" x="554" y="262">a request</text>
  <text class="light small" x="828" y="262" text-anchor="end">a request</text>

  <!-- Row 4: the handler at the level-4 vector -->
  <text class="light name" x="16" y="350">audio_irq</text>
  <text class="muted small" x="16" y="366">at each request</text>
  <rect class="irq" x="548" y="330" width="144" height="44" rx="3"/>
  <text class="ink small" x="620" y="348" text-anchor="middle">count 1 to 0:</text>
  <text class="ink small" x="620" y="363" text-anchor="middle">plays on</text>
  <rect class="irq" x="765" y="330" width="140" height="44" rx="3"/>
  <text class="ink small" x="835" y="348" text-anchor="middle">0 to −1: stopped,</text>
  <text class="ink small" x="835" y="363" text-anchor="middle">DMA and bit off</text>
  <path class="wire" d="M540 300 L540 328"/>
  <path class="wire" d="M840 300 L840 328"/>

  <text class="light small" x="16" y="450">A sample the tick asks for starts at the second VBlank after the tick.</text>
  <text class="light small" x="16" y="470">A repeat count of N plays N cycles; a count of −1 plays until the tick stops it.</text>
</svg>
