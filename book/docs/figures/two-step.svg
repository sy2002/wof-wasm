<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 374" width="1000" height="374" role="img" aria-labelledby="title desc">
  <title id="title">Two-step scaling, in one pass of the fragment shader</title>
  <desc id="desc">Left, six framebuffer pixels in two rows, each holding a colour number, 7, 7 and 3 in both rows; row 0 is shown through palette a, a sky, row 1 through palette b, a sea, so the same number gives another colour in each row. Middle, step 1: the pixels enlarged by whole numbers with nearest neighbour, here two texels across and three down, an example smaller than a real screen's, so that every pixel is a block of equal size, taller than wide as on PAL; step 2: the smooth reduction to the box, whose grid of device pixels, dashed, falls between the blocks; one device pixel samples at a sampling point where four blocks meet, and its four texels are outlined. Right, those four texels: each is looked up through the palette of its own row before anything is mixed, and the four colours are then mixed by their distance from the sample point into the device pixel. Below: the fragment shader does both steps for every device pixel from three textures, the framebuffer, the row table and the palettes, and never makes the enlargement.</desc>
  <style>
    /* The design's colours, each an entry of one of the game's palettes; the picture's four
       colours stand for one row of sky and one of sea. */
    .number  { fill: #444455; /* wingspalette 26 */ }
    .sky7    { fill: #77AACC; /* wingspalette 22 */ }
    .sky3    { fill: #EEEEEE; /* wingstitle 31 */ }
    .sea7    { fill: #0066AA; /* ocean.palette 10 */ }
    .sea3    { fill: #003377; /* ocean.palette 13 */ }
    .mark    { fill: #FFBB00; /* wingstitle 25 */ }
    .light   { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted   { fill: #AAAABB; /* wingspalette 29 */ }
    .texel   { fill: none; stroke: #111122; /* wingspalette 6 */ stroke-width: 1; }
    .grid    { stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 1; stroke-dasharray: 3 3; }
    .four    { fill: none; stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 3; }
    .result  { fill: none; stroke: #EEEEEE; /* wingstitle 31 */ stroke-width: 2; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <text class="light label" x="10" y="24">Two steps, worked out in one pass of the fragment shader</text>
  <!-- Left: the framebuffer, a colour number a pixel, a palette a row -->
  <text class="light label" x="10" y="60">The framebuffer</text>
  <text class="muted small" x="10" y="78">a colour number a pixel</text>
  <rect class="number" x="14" y="94" width="40" height="40" rx="2"/>
  <text class="light" x="34" y="119" text-anchor="middle">7</text>
  <rect class="number" x="58" y="94" width="40" height="40" rx="2"/>
  <text class="light" x="78" y="119" text-anchor="middle">7</text>
  <rect class="number" x="102" y="94" width="40" height="40" rx="2"/>
  <text class="light" x="122" y="119" text-anchor="middle">3</text>
  <rect class="number" x="14" y="138" width="40" height="40" rx="2"/>
  <text class="light" x="34" y="163" text-anchor="middle">7</text>
  <rect class="number" x="58" y="138" width="40" height="40" rx="2"/>
  <text class="light" x="78" y="163" text-anchor="middle">7</text>
  <rect class="number" x="102" y="138" width="40" height="40" rx="2"/>
  <text class="light" x="122" y="163" text-anchor="middle">3</text>
  <text class="light small" x="152" y="119">row 0: palette a</text>
  <text class="light small" x="152" y="163">row 1: palette b</text>
  <text class="muted small" x="10" y="202">the same number, another row,</text>
  <text class="muted small" x="10" y="218">another colour</text>
  <!-- Middle: step 1, the nearest enlargement by whole numbers (here 3 across, 2 down); step 2, the reduction -->
  <text class="light label" x="264" y="60">1. Enlarged by whole numbers</text>
  <text class="muted small" x="264" y="78">nearest, here 2 across by 3 down: every pixel a block of equal size</text>
  <rect class="sky7" x="284" y="94" width="44" height="66"/>
  <rect class="sky7" x="328" y="94" width="44" height="66"/>
  <rect class="sky3" x="372" y="94" width="44" height="66"/>
  <rect class="sea7" x="284" y="160" width="44" height="66"/>
  <rect class="sea7" x="328" y="160" width="44" height="66"/>
  <rect class="sea3" x="372" y="160" width="44" height="66"/>
  <!-- the texels of the enlargement, thin lines -->
  <line class="texel" x1="284" y1="94" x2="284" y2="226"/>
  <line class="texel" x1="306" y1="94" x2="306" y2="226"/>
  <line class="texel" x1="328" y1="94" x2="328" y2="226"/>
  <line class="texel" x1="350" y1="94" x2="350" y2="226"/>
  <line class="texel" x1="372" y1="94" x2="372" y2="226"/>
  <line class="texel" x1="394" y1="94" x2="394" y2="226"/>
  <line class="texel" x1="416" y1="94" x2="416" y2="226"/>
  <line class="texel" x1="284" y1="94" x2="416" y2="94"/>
  <line class="texel" x1="284" y1="116" x2="416" y2="116"/>
  <line class="texel" x1="284" y1="138" x2="416" y2="138"/>
  <line class="texel" x1="284" y1="160" x2="416" y2="160"/>
  <line class="texel" x1="284" y1="182" x2="416" y2="182"/>
  <line class="texel" x1="284" y1="204" x2="416" y2="204"/>
  <line class="texel" x1="284" y1="226" x2="416" y2="226"/>
  <!-- step 2: the box's device pixels, a pitch of 1.7 texels, dashed -->
  <line class="grid" x1="284" y1="88" x2="284" y2="232"/>
  <line class="grid" x1="321.4" y1="88" x2="321.4" y2="232"/>
  <line class="grid" x1="358.8" y1="88" x2="358.8" y2="232"/>
  <line class="grid" x1="396.2" y1="88" x2="396.2" y2="232"/>
  <line class="grid" x1="278" y1="94" x2="422" y2="94"/>
  <line class="grid" x1="278" y1="131.4" x2="422" y2="131.4"/>
  <line class="grid" x1="278" y1="168.8" x2="422" y2="168.8"/>
  <line class="grid" x1="278" y1="206.2" x2="422" y2="206.2"/>
  <!-- the sample point of one device pixel, where four blocks meet, and its four texels -->
  <path class="four" d="M350.0 138.0 h44 v44 h-44 Z"/>
  <circle class="mark" cx="377.5" cy="150.1" r="4"/>
  <text class="light label" x="264" y="260">2. Reduced smoothly to the box</text>
  <text class="muted small" x="264" y="278">dashed: the device pixels; a dot: one sampling point</text>
  <!-- Right: the four texels, each through its own row's palette, then mixed -->
  <text class="light label" x="584" y="60">At a block edge</text>
  <text class="muted small" x="584" y="78">each through its own row's palette, then mixed</text>
  <rect class="number" x="584" y="94" width="30" height="26" rx="2"/>
  <text class="light" x="599" y="112" text-anchor="middle">7</text>
  <text class="light small" x="624" y="112">row 0, palette a</text>
  <rect class="sky7" x="734" y="94" width="40" height="26" rx="2"/>
  <rect class="number" x="584" y="126" width="30" height="26" rx="2"/>
  <text class="light" x="599" y="144" text-anchor="middle">3</text>
  <text class="light small" x="624" y="144">row 0, palette a</text>
  <rect class="sky3" x="734" y="126" width="40" height="26" rx="2"/>
  <rect class="number" x="584" y="158" width="30" height="26" rx="2"/>
  <text class="light" x="599" y="176" text-anchor="middle">7</text>
  <text class="light small" x="624" y="176">row 1, palette b</text>
  <rect class="sea7" x="734" y="158" width="40" height="26" rx="2"/>
  <rect class="number" x="584" y="190" width="30" height="26" rx="2"/>
  <text class="light" x="599" y="208" text-anchor="middle">3</text>
  <text class="light small" x="624" y="208">row 1, palette b</text>
  <rect class="sea3" x="734" y="190" width="40" height="26" rx="2"/>
  <path class="result" d="M782 94 h10 v122 h-10"/>
  <text class="light small" x="800" y="156">mixed by distance</text>
  <text class="light small" x="800" y="172">into the device pixel</text>
  <text class="muted small" x="584" y="236">Mixing the numbers instead would give</text>
  <text class="muted small" x="584" y="252">a colour neither row has.</text>
  <text class="light" x="10" y="318">The fragment shader works out both steps for every device pixel from three textures,</text>
  <text class="light" x="10" y="338">the framebuffer, the row table and the palettes: the enlargement is never made,</text>
  <text class="light" x="10" y="358">and where all four texels lie in one block it reads one.</text>
</svg>
