<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Four chains through the repository</title>
  <desc id="desc">Four lanes, one chain each. 1, the names: re/names.txt, a name for an address kept by hand, goes into tools/disasm.py, which makes the listing and the inventory again, re/Wings.lst and re/functions.csv, made and committed; tools/skel.py and book/tools/listings.py pick the name up. 2, the game's tables: re/tables.toml, kept by hand, and three files of the original, original/disk/Wings_of_Fury/Wings, original/disk/Wings_of_Fury/songplay and original/kick.rom, go into tools/extract_tables.py, which reads their bytes at every build into src/gen/, the tables in C, never committed, from which the core is built into dist/wof.html with src/ and web/; book/tools/elements.py reads the same bytes. 3, the comparison, a chain of references: a claim in re/notes/ names the test that shows it, a test in tests/ names its runs, a run description in tests/runs/ holds the player's hands, and tools/headless.py replays a run with one command; a chapter of the book cites the test by its name. 4, the generated files: re/Wings.lst, re/functions.csv, re/songplay.lst and ref/sheets/ are held by tests/test_generated.py, which makes them again and compares them byte for byte; book/docs/generated/, the book's listings, figures and data, is held by book/tools/build.py --check in the same way.</desc>
  <style>
    /* The design's colours, each an entry of one of the game's palettes. */
    .hand  { fill: #FFBB00; /* wingstitle 25 */ }
    .orig  { fill: #77AACC; /* wingspalette 22 */ }
    .tool  { fill: #AAAABB; /* wingspalette 29 */ }
    .made  { fill: #CCCCDD; /* wingspalette 30 */ }
    .ink   { fill: #111122; /* wingspalette 6 */ }
    .light { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted { fill: #AAAABB; /* wingspalette 29 */ }
    .gen   { stroke: #888899; /* wingspalette 28 */ stroke-width: 1.5; stroke-dasharray: 5 3; fill: none; }
    .wire  { stroke: #EEEEEE; /* wingstitle 31 */ stroke-width: 1.5; fill: none; }
    .tip   { fill: #EEEEEE; /* wingstitle 31 */ }
    .names { stroke: #77AACC; /* wingspalette 22 */ stroke-width: 2; stroke-dasharray: 2 4; fill: none; }
    .namestip { fill: #77AACC; /* wingspalette 22 */ }
    .hold  { stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .holdtip { fill: #FFBB00; /* wingstitle 25 */ }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .code  { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>

  <text class="light label" x="16" y="24">Four chains through the repository</text>
  <text class="muted small" x="16" y="44">from what is kept by hand to what is made from it and what holds what is made; the comparison is a chain of references</text>

  <!-- 1. The names -->
  <text class="light label" x="16" y="78">1   The names: one name, everywhere the program is shown</text>
  <rect class="hand" x="16" y="88" width="200" height="70" rx="3"/>
  <text class="ink code" x="28" y="110">re/names.txt</text>
  <text class="ink small" x="28" y="128">a name for an address,</text>
  <text class="ink small" x="28" y="146">kept by hand</text>
  <path class="wire" d="M216 123 L257 123"/>
  <path class="tip" d="M265 123 L256 118 L256 128 Z"/>
  <rect class="tool" x="266" y="88" width="200" height="70" rx="3"/>
  <text class="ink code" x="278" y="110">tools/disasm.py</text>
  <text class="ink small" x="278" y="128">makes the listing and</text>
  <text class="ink small" x="278" y="146">the inventory again</text>
  <path class="wire" d="M466 123 L507 123"/>
  <path class="tip" d="M515 123 L506 118 L506 128 Z"/>
  <rect class="made" x="516" y="88" width="200" height="70" rx="3"/>
  <text class="ink code" x="528" y="110">re/Wings.lst</text>
  <text class="ink code" x="528" y="128">re/functions.csv</text>
  <text class="ink small" x="528" y="146">made, and committed</text>
  <path class="wire" d="M716 123 L757 123"/>
  <path class="tip" d="M765 123 L756 118 L756 128 Z"/>
  <rect class="tool" x="766" y="88" width="200" height="70" rx="3"/>
  <text class="ink code" x="778" y="110">tools/skel.py</text>
  <text class="ink code" x="778" y="128">book/tools/listings.py</text>
  <text class="ink small" x="778" y="146">pick the name up</text>

  <!-- 2. The game's tables -->
  <text class="light label" x="16" y="190">2   The game's tables: no number of the game typed again</text>
  <rect class="hand" x="16" y="202" width="226" height="34" rx="3"/>
  <text class="ink code" x="28" y="224">re/tables.toml</text>
  <rect class="orig" x="16" y="242" width="226" height="70" rx="3"/>
  <text class="ink code" x="28" y="262">original/disk/Wings_of_Fury/</text>
  <text class="ink code" x="40" y="280">Wings</text>
  <text class="ink code" x="40" y="298">songplay</text>
  <rect class="orig" x="16" y="318" width="226" height="34" rx="3"/>
  <text class="ink code" x="28" y="340">original/kick.rom</text>
  <path class="wire" d="M242 219 L259 246"/>
  <path class="tip" d="M264 253 L255 248 L263 243 Z"/>
  <path class="wire" d="M242 277 L256 277"/>
  <path class="tip" d="M265 277 L256 272 L256 282 Z"/>
  <path class="wire" d="M242 335 L259 308"/>
  <path class="tip" d="M264 301 L263 311 L255 306 Z"/>
  <rect class="tool" x="266" y="242" width="200" height="70" rx="3"/>
  <text class="ink code" x="278" y="264">tools/extract_tables.py</text>
  <text class="ink small" x="278" y="282">reads their bytes</text>
  <text class="ink small" x="278" y="300">at every build</text>
  <path class="wire" d="M466 277 L507 277"/>
  <path class="tip" d="M515 277 L506 272 L506 282 Z"/>
  <rect class="gen" x="516" y="242" width="200" height="70" rx="3"/>
  <text class="light code" x="528" y="264">src/gen/</text>
  <text class="light small" x="528" y="282">the tables in C,</text>
  <text class="light small" x="528" y="300">never committed</text>
  <path class="wire" d="M716 265 L757 251"/>
  <path class="tip" d="M765 249 L758 256 L755 246 Z"/>
  <rect class="made" x="766" y="228" width="200" height="42" rx="3"/>
  <text class="ink code" x="778" y="246">dist/wof.html</text>
  <text class="ink small" x="778" y="263">built with src/ and web/</text>
  <path class="wire" d="M366 312 L366 340 L740 340 L740 307 L757 307"/>
  <path class="tip" d="M765 307 L756 302 L756 312 Z"/>
  <rect class="tool" x="766" y="286" width="200" height="42" rx="3"/>
  <text class="ink code" x="778" y="304">book/tools/elements.py</text>
  <text class="ink small" x="778" y="321">the same bytes, for the book</text>

  <!-- 3. The comparison -->
  <text class="light label" x="16" y="384">3   The comparison: from a claim to a run anyone can replay</text>
  <rect class="hand" x="16" y="394" width="200" height="70" rx="3"/>
  <text class="ink code" x="28" y="416">re/notes/</text>
  <text class="ink small" x="28" y="434">a claim names the test</text>
  <text class="ink small" x="28" y="452">that shows it</text>
  <path class="names" d="M218 429 L257 429"/>
  <path class="namestip" d="M265 429 L256 424 L256 434 Z"/>
  <rect class="tool" x="266" y="394" width="200" height="70" rx="3"/>
  <text class="ink code" x="278" y="416">tests/test_*.py</text>
  <text class="ink small" x="278" y="434">a test, by its name,</text>
  <text class="ink small" x="278" y="452">names its runs</text>
  <path class="names" d="M468 429 L507 429"/>
  <path class="namestip" d="M515 429 L506 424 L506 434 Z"/>
  <rect class="hand" x="516" y="394" width="200" height="70" rx="3"/>
  <text class="ink code" x="528" y="416">tests/runs/</text>
  <text class="ink small" x="528" y="434">a run description:</text>
  <text class="ink small" x="528" y="452">the player&#39;s hands</text>
  <path class="wire" d="M716 429 L757 429"/>
  <path class="tip" d="M765 429 L756 424 L756 434 Z"/>
  <rect class="tool" x="766" y="394" width="200" height="70" rx="3"/>
  <text class="ink code" x="778" y="416">tools/headless.py</text>
  <text class="ink small" x="778" y="434">replays a run with</text>
  <text class="ink small" x="778" y="452">one command</text>
  <text class="muted small" x="266" y="482">a chapter of the book cites the test by its name</text>

  <!-- 4. The generated files -->
  <text class="light label" x="16" y="516">4   The generated files: committed, and held to what the tools make</text>
  <rect class="made" x="16" y="526" width="200" height="84" rx="3"/>
  <text class="ink code" x="28" y="547">re/Wings.lst</text>
  <text class="ink code" x="28" y="563">re/functions.csv</text>
  <text class="ink code" x="28" y="579">re/songplay.lst</text>
  <text class="ink code" x="28" y="595">ref/sheets/</text>
  <path class="hold" d="M264 568 L225 568"/>
  <path class="holdtip" d="M217 568 L226 563 L226 573 Z"/>
  <rect class="tool" x="266" y="533" width="200" height="70" rx="3"/>
  <text class="ink code" x="278" y="555">tests/test_generated.py</text>
  <text class="ink small" x="278" y="573">makes them again</text>
  <text class="ink small" x="278" y="591">and compares, byte for byte</text>
  <rect class="made" x="516" y="533" width="200" height="70" rx="3"/>
  <text class="ink code" x="528" y="555">book/docs/generated/</text>
  <text class="ink small" x="528" y="573">the book&#39;s listings,</text>
  <text class="ink small" x="528" y="591">figures and data</text>
  <path class="hold" d="M764 568 L725 568"/>
  <path class="holdtip" d="M717 568 L726 563 L726 573 Z"/>
  <rect class="tool" x="766" y="533" width="200" height="70" rx="3"/>
  <text class="ink code" x="778" y="555">book/tools/build.py</text>
  <text class="ink code" x="778" y="573">--check</text>
  <text class="ink small" x="778" y="591">the same, for the book</text>

  <!-- The key -->
  <rect class="hand" x="16" y="632" width="16" height="12" rx="2"/>
  <text class="light small" x="38" y="643">kept by hand</text>
  <rect class="orig" x="132" y="632" width="16" height="12" rx="2"/>
  <text class="light small" x="154" y="643">the original&#39;s</text>
  <rect class="tool" x="262" y="632" width="16" height="12" rx="2"/>
  <text class="light small" x="284" y="643">a tool or a test</text>
  <rect class="made" x="396" y="632" width="16" height="12" rx="2"/>
  <text class="light small" x="418" y="643">made, committed</text>
  <rect class="gen" x="530" y="632" width="16" height="12" rx="2"/>
  <text class="light small" x="552" y="643">made, never committed</text>
  <path class="wire" d="M16 662 L40 662"/>
  <path class="tip" d="M47 662 L39 658 L39 666 Z"/>
  <text class="light small" x="54" y="666">makes or feeds</text>
  <path class="names" d="M162 662 L186 662"/>
  <path class="namestip" d="M193 662 L185 658 L185 666 Z"/>
  <text class="light small" x="200" y="666">names</text>
  <path class="hold" d="M262 662 L286 662"/>
  <path class="holdtip" d="M293 662 L285 658 L285 666 Z"/>
  <text class="light small" x="300" y="666">holds, byte for byte</text>
</svg>
