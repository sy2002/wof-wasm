<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-labelledby="title desc">
  <title id="title">The two loops</title>
  <desc id="desc">Three rows over the same steps of a mission, left to right: the front end from the program's start, then S, the end of the setup, and the passes and ticks that follow, P, T, P, P, T, P. At the top the original, run under the headless original and recorded, its records after every step. In the middle the open loop: the port runs the front end and the setup itself, and from S on, after every step, the original's state after that step is handed down to the port before the port's next step, so that every pass and every tick starts from the original's state and is compared alone with the original's record of the same step. At the bottom the closed loop: the port runs on its own from the program's start, given nothing but the entropy seed and the map list's address, once, and after every pass and every tick its state is compared with the original's record of the same step.</desc>
  <style>
    /* The book's colours (stylesheets/book.css), each an entry of one of the game's palettes. */
    .orig  { fill: #77AACC; /* wingspalette 22 */ }
    .port  { fill: #44AA44; /* iff-dash 6 */ }
    .given { fill: #FFBB00; /* wingstitle 25 */ }
    .made  { fill: #CCCCDD; /* wingspalette 30 */ }
    .ink   { fill: #111122; /* wingspalette 6 */ }
    .light { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted { fill: #AAAABB; /* wingspalette 29 */ }
    .give  { stroke: #FFBB00; /* wingstitle 25 */ stroke-width: 2; fill: none; }
    .guide { stroke: #666677; /* wingspalette 27 */ stroke-width: 1; stroke-dasharray: 3 3; }
    .frame { stroke: #888899; /* wingspalette 28 */ stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .mono  { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>

  <!-- The steps, 70 units apart: S at x = 310, then P, T, P, P, T, P; a box is 52 wide -->
  <text class="muted small" x="200" y="40">the program's start</text>
  <text class="muted small" x="310" y="40">S the setup's end, P a pass, T a tick</text>
  <line class="guide" x1="336" y1="56" x2="336" y2="386"/>
  <line class="guide" x1="406" y1="56" x2="406" y2="386"/>
  <line class="guide" x1="476" y1="56" x2="476" y2="386"/>
  <line class="guide" x1="546" y1="56" x2="546" y2="386"/>
  <line class="guide" x1="616" y1="56" x2="616" y2="386"/>
  <line class="guide" x1="686" y1="56" x2="686" y2="386"/>
  <line class="guide" x1="756" y1="56" x2="756" y2="386"/>

  <!-- The original, recorded: a record after every step -->
  <text class="light label" x="10" y="88">the original</text>
  <text class="light small" x="10" y="104">recorded under the</text>
  <text class="light small" x="10" y="119">headless original</text>
  <rect class="frame" x="200" y="70" width="92" height="40" rx="3"/>
  <text class="light small" x="246" y="94" text-anchor="middle">front end</text>
  <rect class="orig" x="310" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="336" y="96" text-anchor="middle">S</text>
  <rect class="orig" x="380" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="406" y="96" text-anchor="middle">P</text>
  <rect class="orig" x="450" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="476" y="96" text-anchor="middle">T</text>
  <rect class="orig" x="520" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="546" y="96" text-anchor="middle">P</text>
  <rect class="orig" x="590" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="616" y="96" text-anchor="middle">P</text>
  <rect class="orig" x="660" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="686" y="96" text-anchor="middle">T</text>
  <rect class="orig" x="730" y="70" width="52" height="40" rx="3"/>
  <text class="ink mono" x="756" y="96" text-anchor="middle">P</text>
  <text class="light label" x="800" y="96">…</text>

  <!-- The open loop: the original's state after each step handed down before the port's next step -->
  <path class="give" d="M356 112 L383.3 174.9"/>
  <path class="given" d="M388 186 L379.7 176.5 L387.0 173.4 Z"/>
  <path class="give" d="M426 112 L453.3 174.9"/>
  <path class="given" d="M458 186 L449.7 176.5 L457.0 173.4 Z"/>
  <path class="give" d="M496 112 L523.3 174.9"/>
  <path class="given" d="M528 186 L519.7 176.5 L527.0 173.4 Z"/>
  <path class="give" d="M566 112 L593.3 174.9"/>
  <path class="given" d="M598 186 L589.7 176.5 L597.0 173.4 Z"/>
  <path class="give" d="M636 112 L663.3 174.9"/>
  <path class="given" d="M668 186 L659.7 176.5 L667.0 173.4 Z"/>
  <path class="give" d="M706 112 L733.3 174.9"/>
  <path class="given" d="M738 186 L729.7 176.5 L737.0 173.4 Z"/>

  <text class="light label" x="10" y="208">the open loop</text>
  <text class="light small" x="10" y="224">set to the original's state</text>
  <text class="light small" x="10" y="239">after every step</text>
  <rect class="port" x="200" y="190" width="92" height="40" rx="3"/>
  <text class="ink small" x="246" y="214" text-anchor="middle">front end</text>
  <rect class="port" x="310" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="336" y="216" text-anchor="middle">S</text>
  <rect class="port" x="380" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="406" y="216" text-anchor="middle">P</text>
  <rect class="port" x="450" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="476" y="216" text-anchor="middle">T</text>
  <rect class="port" x="520" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="546" y="216" text-anchor="middle">P</text>
  <rect class="port" x="590" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="616" y="216" text-anchor="middle">P</text>
  <rect class="port" x="660" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="686" y="216" text-anchor="middle">T</text>
  <rect class="port" x="730" y="190" width="52" height="40" rx="3"/>
  <text class="ink mono" x="756" y="216" text-anchor="middle">P</text>
  <text class="light label" x="800" y="216">…</text>
  <!-- compared after every pass and every tick -->
  <rect class="made" x="397" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="406" y="246" text-anchor="middle">=</text>
  <rect class="made" x="467" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="476" y="246" text-anchor="middle">=</text>
  <rect class="made" x="537" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="546" y="246" text-anchor="middle">=</text>
  <rect class="made" x="607" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="616" y="246" text-anchor="middle">=</text>
  <rect class="made" x="677" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="686" y="246" text-anchor="middle">=</text>
  <rect class="made" x="747" y="234" width="18" height="16" rx="2"/>
  <text class="ink small" x="756" y="246" text-anchor="middle">=</text>

  <!-- The closed loop: on its own from the program's start -->
  <text class="light label" x="10" y="318">the closed loop</text>
  <text class="light small" x="10" y="334">on its own from</text>
  <text class="light small" x="10" y="349">the program's start</text>
  <rect class="port" x="200" y="300" width="92" height="40" rx="3"/>
  <text class="ink small" x="246" y="324" text-anchor="middle">front end</text>
  <rect class="port" x="310" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="336" y="326" text-anchor="middle">S</text>
  <rect class="port" x="380" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="406" y="326" text-anchor="middle">P</text>
  <rect class="port" x="450" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="476" y="326" text-anchor="middle">T</text>
  <rect class="port" x="520" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="546" y="326" text-anchor="middle">P</text>
  <rect class="port" x="590" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="616" y="326" text-anchor="middle">P</text>
  <rect class="port" x="660" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="686" y="326" text-anchor="middle">T</text>
  <rect class="port" x="730" y="300" width="52" height="40" rx="3"/>
  <text class="ink mono" x="756" y="326" text-anchor="middle">P</text>
  <text class="light label" x="800" y="326">…</text>
  <rect class="made" x="397" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="406" y="356" text-anchor="middle">=</text>
  <rect class="made" x="467" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="476" y="356" text-anchor="middle">=</text>
  <rect class="made" x="537" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="546" y="356" text-anchor="middle">=</text>
  <rect class="made" x="607" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="616" y="356" text-anchor="middle">=</text>
  <rect class="made" x="677" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="686" y="356" text-anchor="middle">=</text>
  <rect class="made" x="747" y="344" width="18" height="16" rx="2"/>
  <text class="ink small" x="756" y="356" text-anchor="middle">=</text>

  <!-- What the closed loop is given, once -->
  <rect class="given" x="200" y="396" width="250" height="44" rx="3"/>
  <text class="ink small" x="212" y="414">the entropy seed and</text>
  <text class="ink small" x="212" y="431">the map list's address, once</text>
  <path class="give" d="M246 394 L246 354"/>
  <path class="given" d="M246 342 L242 354 L250 354 Z"/>

  <!-- The key -->
  <path class="give" d="M490 408 L510 408"/>
  <path class="given" d="M522 408 L510 404 L510 412 Z"/>
  <text class="light small" x="532" y="412">the original's state, handed over</text>
  <rect class="made" x="497" y="420" width="18" height="16" rx="2"/>
  <text class="ink small" x="506" y="432" text-anchor="middle">=</text>
  <text class="light small" x="532" y="432">compared with the original's record</text>
</svg>
