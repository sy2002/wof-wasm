<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-labelledby="title desc">
  <title id="title">One bit, two meanings</title>
  <desc id="desc">Two first words of a 68000 shift instruction, sixteen bits each, bit 15 on the left. Above, asr.w #$1, d4, the word 0xE244 at 0x010906, a shift of a register: 1110, then the count 001, the direction 0 for right, the size 01 for a word, 0 for a count held in the instruction, the type 00 for arithmetic in bits 4 and 3, and the register 100, D4. Bit 3 is the type's low bit, 0 for arithmetic and 1 for logical. Below, asr.w $12(a2), the word 0xE0EA at 0x010BB8, a shift of a word in memory: 1110, then the type 000 for arithmetic in bits 11 to 9, the direction 0 for right, 11 for the memory form, the mode 101 for an address register with an offset, and the register 010, A2. Here bit 3 is the mode's low bit, 1. The emulator reads bit 3 in both forms and so takes the memory shift for a logical one; the 68000 reads the type in bits 11 to 9.</desc>
  <style>
    /* The book's colours (stylesheets/book.css), each an entry of one of the game's palettes. */
    .cell  { fill: #CCCCDD; /* wingspalette 30 */ }
    .fixed { fill: #888899; /* wingspalette 28 */ }
    .type  { fill: #FFBB00; /* wingstitle 25 */ }
    .ink   { fill: #111122; /* wingspalette 6 */ }
    .light { fill: #EEEEEE; /* wingstitle 31 */ }
    .muted { fill: #AAAABB; /* wingspalette 29 */ }
    .mark  { stroke: #EE6622; /* wingspalette 2 */ stroke-width: 3; fill: none; }
    .marktext { fill: #EE6622; /* wingspalette 2 */ }
    .wire  { stroke: #AAAABB; /* wingspalette 29 */ stroke-width: 1.2; fill: none; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px; }
    .mono  { font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <!-- Bit numbers -->
  <text class="muted small" x="203" y="30" text-anchor="middle">15</text>
  <text class="muted small" x="317" y="30" text-anchor="middle">12</text>
  <text class="muted small" x="355" y="30" text-anchor="middle">11</text>
  <text class="muted small" x="431" y="30" text-anchor="middle">9</text>
  <text class="muted small" x="469" y="30" text-anchor="middle">8</text>
  <text class="muted small" x="545" y="30" text-anchor="middle">6</text>
  <text class="muted small" x="583" y="30" text-anchor="middle">5</text>
  <text class="muted small" x="659" y="30" text-anchor="middle">3</text>
  <text class="muted small" x="697" y="30" text-anchor="middle">2</text>
  <text class="muted small" x="773" y="30" text-anchor="middle">0</text>
  <!-- A shift of a register -->
  <text class="light mono" x="16" y="58">asr.w #$1, d4</text>
  <text class="muted small" x="16" y="76">0xE244, a register</text>
  <rect class="fixed" x="186" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="203" y="63" text-anchor="middle">1</text>
  <rect class="fixed" x="224" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="241" y="63" text-anchor="middle">1</text>
  <rect class="fixed" x="262" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="279" y="63" text-anchor="middle">1</text>
  <rect class="fixed" x="300" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="317" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="338" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="355" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="376" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="393" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="414" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="431" y="63" text-anchor="middle">1</text>
  <rect class="cell" x="452" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="469" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="490" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="507" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="528" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="545" y="63" text-anchor="middle">1</text>
  <rect class="cell" x="566" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="583" y="63" text-anchor="middle">0</text>
  <rect class="type" x="604" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="621" y="63" text-anchor="middle">0</text>
  <rect class="type" x="642" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="659" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="680" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="697" y="63" text-anchor="middle">1</text>
  <rect class="cell" x="718" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="735" y="63" text-anchor="middle">0</text>
  <rect class="cell" x="756" y="40" width="34" height="34" rx="2"/>
  <text class="ink mono" x="773" y="63" text-anchor="middle">0</text>
  <path class="wire" d="M338 80 L338 86 L448 86 L448 80"/>
  <text class="light small" x="393" y="102" text-anchor="middle">count 1</text>
  <path class="wire" d="M452 80 L452 86 L486 86 L486 80"/>
  <text class="light small" x="469" y="102" text-anchor="middle">right</text>
  <path class="wire" d="M490 80 L490 86 L562 86 L562 80"/>
  <text class="light small" x="526" y="102" text-anchor="middle">word</text>
  <path class="wire" d="M604 80 L604 86 L676 86 L676 80"/>
  <text class="light small" x="640" y="102" text-anchor="middle">type 00:</text>
  <text class="light small" x="640" y="117" text-anchor="middle">arithmetic</text>
  <path class="wire" d="M680 80 L680 86 L790 86 L790 80"/>
  <text class="light small" x="735" y="102" text-anchor="middle">D4</text>
  <rect class="mark" x="639" y="37" width="40" height="40" rx="3"/>
  <!-- A shift of a word in memory -->
  <text class="light mono" x="16" y="208">asr.w $12(a2)</text>
  <text class="muted small" x="16" y="226">0xE0EA, a memory word</text>
  <rect class="fixed" x="186" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="203" y="213" text-anchor="middle">1</text>
  <rect class="fixed" x="224" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="241" y="213" text-anchor="middle">1</text>
  <rect class="fixed" x="262" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="279" y="213" text-anchor="middle">1</text>
  <rect class="fixed" x="300" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="317" y="213" text-anchor="middle">0</text>
  <rect class="type" x="338" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="355" y="213" text-anchor="middle">0</text>
  <rect class="type" x="376" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="393" y="213" text-anchor="middle">0</text>
  <rect class="type" x="414" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="431" y="213" text-anchor="middle">0</text>
  <rect class="cell" x="452" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="469" y="213" text-anchor="middle">0</text>
  <rect class="cell" x="490" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="507" y="213" text-anchor="middle">1</text>
  <rect class="cell" x="528" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="545" y="213" text-anchor="middle">1</text>
  <rect class="cell" x="566" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="583" y="213" text-anchor="middle">1</text>
  <rect class="cell" x="604" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="621" y="213" text-anchor="middle">0</text>
  <rect class="cell" x="642" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="659" y="213" text-anchor="middle">1</text>
  <rect class="cell" x="680" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="697" y="213" text-anchor="middle">0</text>
  <rect class="cell" x="718" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="735" y="213" text-anchor="middle">1</text>
  <rect class="cell" x="756" y="190" width="34" height="34" rx="2"/>
  <text class="ink mono" x="773" y="213" text-anchor="middle">0</text>
  <path class="wire" d="M338 230 L338 236 L448 236 L448 230"/>
  <text class="light small" x="393" y="252" text-anchor="middle">type 000:</text>
  <text class="light small" x="393" y="267" text-anchor="middle">arithmetic</text>
  <path class="wire" d="M452 230 L452 236 L486 236 L486 230"/>
  <text class="light small" x="469" y="252" text-anchor="middle">right</text>
  <path class="wire" d="M490 230 L490 236 L562 236 L562 230"/>
  <text class="light small" x="526" y="252" text-anchor="middle">memory</text>
  <text class="light small" x="526" y="267" text-anchor="middle">form</text>
  <path class="wire" d="M566 230 L566 236 L676 236 L676 230"/>
  <text class="light small" x="621" y="252" text-anchor="middle">mode 101:</text>
  <text class="light small" x="621" y="267" text-anchor="middle">an address register</text>
  <text class="light small" x="621" y="282" text-anchor="middle">with an offset</text>
  <path class="wire" d="M680 230 L680 236 L790 236 L790 230"/>
  <text class="light small" x="735" y="252" text-anchor="middle">A2</text>
  <rect class="mark" x="639" y="187" width="40" height="40" rx="3"/>
  <!-- What each reads -->
  <text class="marktext label" x="16" y="324">bit 3, which the emulator reads as the type:</text>
  <text class="light small" x="16" y="346">in the register form it is the type's low bit, 0 for arithmetic, 1 for logical, and the emulator is right;</text>
  <text class="light small" x="16" y="366">in the memory form it is the mode's low bit, here 1, and the emulator shifts logically.</text>
  <text class="light small" x="16" y="390">The 68000 reads the type of a memory shift in bits 11 to 9: 000, arithmetic.</text>
</svg>
