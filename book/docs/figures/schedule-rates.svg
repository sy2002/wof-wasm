  <rect class="pass" x="681" y="260" width="150" height="30" rx="3"/>
  <text class="ink" x="687" y="280">P</text>
  <rect class="tick" x="809" y="264" width="18" height="22" rx="2"/>
  <text class="ink" x="818" y="280" text-anchor="middle">T</text>
  <text class="record mono" x="234" y="310" text-anchor="middle">V P T</text>
  <text class="record mono" x="286" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="338" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="390" y="310" text-anchor="middle">V P</text>
  <text class="record mono" x="442" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="494" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="546" y="310" text-anchor="middle">V P T</text>
  <text class="record mono" x="598" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="650" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="702" y="310" text-anchor="middle">V P T</text>
  <text class="record mono" x="754" y="310" text-anchor="middle">V</text>
  <text class="record mono" x="806" y="310" text-anchor="middle">V</text>

  <text class="light" x="10" y="346">The same three ticks take the same three bytes at every rate; what runs once a pass runs 12, 6 or 4 times.</text>
  <text class="light small" x="10" y="364">Under each row the schedule a run records: V a VBlank, P a pass begun after it, T a logic tick.</text>
</svg>
