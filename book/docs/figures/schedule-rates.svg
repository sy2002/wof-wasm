  <text class="light small" x="10" y="294">4 passes, 3 ticks</text>
  <rect class="pass" x="213" y="260" width="150" height="30" rx="3"/>
  <text class="ink" x="219" y="280">P</text>
  <rect class="tick" x="341" y="264" width="18" height="22" rx="2"/>
