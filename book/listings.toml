# The listings the chapters show, named in one place.
#
# book/tools/listings.py extracts each entry from the real sources into
# docs/generated/listings/<kind>/<name>.<ext>, with a first line that names the source file and
# the line range (or the address range); a chapter includes the file with pymdownx.snippets.
# A name that no longer exists fails the run with the name.
#
#   kind    asm   a routine of re/Wings.lst, by its name in re/functions.csv: its lines from
#                 its start address to its end
#           skel  the control-flow skeleton of a routine of re/Wings.lst: what tools/skel.py
#                 prints for it by name, run at build time
#           c     a C function of src/*.c, or a variable at file scope, with the comment
#                 directly above it
#           js    a function or a method of web/*.js, with the comment directly above it
#           py    a function or a class of tools/*.py, or of the file `file` names (a test of
#                 tests/, say), or a variable at module level (an assignment), with the
#                 comments directly above it
#           json  the JSON file `file` names, the whole of it, laid out one key of the top-level
#                 object a line and one element of a top-level list a line; `name` names the
#                 extract
#   name    the routine; a method is Class.method, and in Python a function defined inside a
#           function outer.inner
#   file    the source file, needed only where the name alone is not unique or the file lies
#           outside the kind's directory (not for asm; always for json)
#   from    asm: the part of the routine from this address ...
#   to      ... to the instruction at this address, both inclusive
#           py and c: the part of the function from the first of its lines that holds the
#           text `from` to the first line at or after it that holds the text `to`, both
#           inclusive, dedented (give the part a name with `as`); a c part without `to` runs
#           to the function's end
#   head    asm only: true keeps the header the listing gives the routine above its label
#           (its kind, frame, far-call slot, comment and callers); for a part, only from the start
#   as      the name of the extract, where it is not the routine's (a part, say)
#   lines   the most lines the extract may have, the first line not counted.  The default is
#           40; a longer routine fails the run unless its entry asks for more here.

