# The emulator's memory-form shift, chapter 5: object_step bounces a bomb on a runway, the
# vertical speed turned and halved, then the horizontal halved, with two asr.w on memory.
[[listing]]
kind = "asm"
name = "object_step"
from = 0x010BB4
to = 0x010BEC
as = "object_step_bounce"

# The third asr.w on memory, in a compiled routine: a word argument halved.
[[listing]]
kind = "asm"
name = "cop_vport_planes"
from = 0x019D58
to = 0x019D5E
as = "cop_vport_planes_shift"

