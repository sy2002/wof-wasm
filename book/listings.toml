# The 68000's machine code as the listing shows it: the game's only random source in use,
# hand-written assembly, a read of the beam's position (VHPOSR, 0xDFF006) among its seven
# instructions (re/notes/random.md).
[[listing]]
kind = "asm"
name = "rand_beam"

# Compiled C beside its port: the map record under a world x, orig 0x01C982; its frame on A5,
# a 16-bit argument at 8(a5) and two variables through A4 (chapter 3).
[[listing]]
kind = "asm"
name = "record_at"

[[listing]]
kind = "c"
name = "wof_record_at"

# A tuning value as an instruction's operand: sound_slots_init sets up slot 4, the burst, its
# period 500 the word that re/tables.toml's slot_periods reads at 0x01200C (chapter 3).
[[listing]]
kind = "asm"
name = "sound_slots_init"
from = 0x011FFE
to = 0x01201C
as = "sound_slots_init_boom"

# The listing's columns and comments, chapter 4: the start of main with the header the listing
# gives it, through its first call of an unnamed routine by its far-call slot.
[[listing]]
kind = "asm"
name = "main"
to = 0x010046
head = true
as = "main_start"

# The control-flow skeleton of a hand-written routine of middling size, chapter 4: map_load
# opens the map's file, reads its two longs and its records, and hands them to map_scan.
[[listing]]
kind = "skel"
name = "map_load"

# An oracle test, chapter 5: the fade's arithmetic held to the original's over every fade the
