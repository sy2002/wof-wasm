how = "Every file under original/disk/Wings_of_Fury but the Finder's .DS_Store, each in the one row whose patterns it matches; the format from its first four bytes (0x3F3 a hunk file, Rpck the packed format with what it unpacks to by tools/rpck.py, PPkc, FORM with its IFF type, CMAP), the row's own words for the rest; packed or not as tools/build.py's game_files() says; the whole twice enlarged."
command = ".venv/bin/python book/tools/figures.py disk-files"

# One row for each kind of file, in the order of chapter 3: `files` are patterns over the paths
# under original/disk/Wings_of_Fury, `where` names them in the figure, `rest` says what a file
# is whose first bytes name no format (SPEC.md 3.1 and 3.5).
[[figure.groups]]
label = "the program"
files = ["Wings"]
where = "Wings"
rest = ""

[[figure.groups]]
label = "the music"
files = ["songplay", "wofsongs"]
where = "songplay, wofsongs"
rest = ""

[[figure.groups]]
label = "shape containers"
files = ["shapes/*.shp"]
where = "shapes/*.shp"
rest = ""

[[figure.groups]]
label = "pictures"
files = ["shapes/broderbund", "shapes/wingstitle", "shapes/creditscreen", "shapes/selectrank",
         "shapes/hiscoreslab", "shapes/hiscore.iff", "shapes/Rank.iff", "shapes/iff-dash",
         "shapes/nightdash"]
