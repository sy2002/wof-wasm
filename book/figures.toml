# The figures of the book, named in one place.
#
# book/tools/figures.py renders each into docs/generated/figures/<file> through the port's
# native library and the repository's tools; `command` remakes that one figure, and
# `figures.py --check` remakes all of them into a temporary directory and compares them with
# the committed files byte for byte.  Every figure is the game's art rendered from its data,
# under the reservation of README.md, Licence.
#
#   maker    screen     the port's 640 x 214 picture through its per-row palettes
#                       (tests/m4_renders.py, picture()), at a VBlank of a run, whole or a box
#                       of it (`crop`: x, y, width, height), scaled to `size`
#            palettes   the per-row palettes of that picture, one band per run of rows
#            shapes     a contact sheet of one shape container (tools/ppkc.py, sheet()), or of
#                       shapes picked from several (`pick`, where [] leaves a cell empty),
#                       packed with `layout = "packed"`
#            map        a map's drawn records (tools/map_decode.py, draw_list())
#            maprecord  a run of a map's records, the columns of one shape: the shape over them
#                       and each record's bits by field (tools/map_decode.py, fields())
#            font       a specimen of the game's font, drawn by the port's text_render
#            planes     one shape taken apart into its stored planes and put together again
#                       (tools/ppkc.py, parse()), as colour numbers and through a palette
#            sample     a sound effect's file as a waveform, the whole and a stretch enlarged; or,
#                       with `song_sample`, a sample of the song data by its name, its one-shot
#                       part in `ink`, its repeat part in `repeat_ink`, the boundary marked
#            blit       the blitter's cookie cut of one plane of a shape over a plain background
#            disk       the game's directory on the disk, its files in rows by kind, their bytes and
#                       formats, and which of them tools/build.py packs into the page
#            packed     the first bytes of a packed file against the bytes they unpack to
#            codemap    the code hunk along its addresses from re/functions.csv, by kind and status
#            pairs      colour tables read from their files by the port's own readers, side by
#                       side, the entries that differ from another table marked and counted
#            fade       the sixteen steps of fades through the port's colour_lerp, framed where
#                       a step differs from each component computed alone
#            record     one record of a shape container byte by byte: its header field by field,
#                       its stored planes beside their bits, its colours with the hotspot framed
#            clearset   shapes over plain grounds by the blit's rule and without their clear and
#                       set bytes, the rule checked against the port's blit (the native library)
#            mirror     one shape as stored and as shape_mirror_x leaves it, the hotspot framed,
#                       checked against the pixels reversed and the port's mirror
#            path       the player's flight over a stretch of a run, tick by tick: the height over
#                       the world x in the colour of the record's state, the carrier's deck, its
#                       lift and its cables, the moments the state changes numbered
#            savegame   a saved game to scale through tools/savegame.py: the walker's pieces in
#                       their order, the raw part enlarged with its regions (checked against the
#                       registered fields), the bytes of no field and the pointer fields' values
#            demo       a demo file as a hexadecimal dump by role, its first rows, the rows around
#                       its 0xFF and its last row, with the input bytes' values and their bits
#            song       a song's first bars from the song data (tools/song_decode.py): a lane for
#                       each track, a bar for each sound from its start to its release, its height
#                       its pitch and its ink its voice (`inks`: a voice's name, a palette entry),
#                       the rest voice a gap; `ticks` of the timer, `per_tick` pixels each
#   shows    what the figure shows, for the caption and the alt text
#   how      how it is made, beyond what the maker and the run say

# The runs of the native core the screens come from.  The core is the one the tests load
# (tests/libwofcore.dylib), seed 1, PAL (wof_set_video_hz 50), two VBlanks a fade step as the
# page has them, on the files packed into dist/wof.html; one wof_vblank and one wof_pass per
# VBlank, as the page's clock issues them.  Fire is the raw byte 16.
[run.front]
what = """The front end left to itself after the story scroller: fire held for three VBlanks from
VBlank 30, which ends the scroller, and nothing after it, so that the first picture, the
title and the credits follow by themselves."""
fire_from = 30
fire_held = 3

[run.mission]
what = """Fire held for three VBlanks in every 33 (VBlanks 31 to 33, 64 to 66, and so on) until
the first mission begins, which it does at VBlank 659, and nothing after it: the player stands
on the carrier's deck with the weapon menu up."""
fire_every = 33
fire_held = 3
mission_at = 659

[run.night]
what = """The mission run as a night mission: night_flag (0x025390, a word) poked to 1 at the rank
selection's end through the native library's test hook, as the comparisons reach the night
(re/notes/porting-m4.md, "Night"; tests/test_world.py, NIGHT); the mission begins at the same
VBlank, with the night dashboard loaded."""
fire_every = 33
fire_held = 3
mission_at = 659
pokes = [[0x025390, 2, 1]]
dash_night = 1

[run.island]
what = """The mission run, and from the VBlank after the mission began the stick by the letters of
`after`, each a bit of the raw byte as tools/headless.py's RAW_BITS gives it: the take-off and the
turn west of tools/pass_observe.py's TAKE_OFF and TURN_LEFT, with a longer wait before the
weapon is chosen (200 VBlanks for 40) and a shorter climb (190 for 400), so that the aircraft
levels out low and flies west over map a's island at full scale. `expect` names the drawing's
copy of the player's position and the scale's step as the core holds them at a VBlank, which
the run checks."""
fire_every = 33
fire_held = 3
mission_at = 659
after = [[200, ""], [3, "F"], [60, ""], [460, "R"], [190, "RU"], [120, "L"], [100, "U"]]
expect = [{vblank = 3500, draw_player_x = 3381, draw_player_y = 109, view_step = 8}]

[run.landing]
what = """The landing script of tools/m4_scripts.py, LANDING, which the autopilot of tools/m4_autopilot.py
found, replayed as the loops of tests/m4compare.py replay it: `schedule` is the raw byte of every
VBlank the headless original recorded when it flew the script (tools/headless.py, its schedule's
V entries, 3197 VBlanks from the program's start as runs of [VBlanks, byte]), and the fades take no
time (`fade_vblanks` 0), as in the headless original. The script's own letters cannot stand in for
it: the headless original takes letters in VBlanks of the front end that its schedule does not
record, and the port given the letters alone never reaches the mission. The port meets the
original's states at the same VBlanks (re/notes/porting-m4.md, "How the port is held to the
original": the landing in both loops); `expect` checks the take-off, the dip after it, the climb's
top and the moment the cable holds the aircraft, the record's fields read through
tests/m4state.py's layout."""
fade_vblanks = 0
mission_at = 444
schedule = [[30, 0], [3, 16], [134, 0], [2, 16], [104, 0], [1, 16], [30, 0], [1, 16], [104, 0],
            [2, 16], [30, 0], [3, 16], [30, 0], [3, 16], [40, 0], [3, 16], [60, 0], [460, 4], [198, 5],
            [164, 4], [112, 8], [31, 9], [56, 8], [4, 9], [4, 8], [4, 9], [4, 8], [4, 9], [24, 8],
            [12, 10], [12, 8], [12, 9], [16, 8], [8, 10], [20, 8], [8, 9], [8, 8], [8, 10], [16, 8],
            [8, 9], [8, 8], [8, 10], [20, 8], [8, 9], [12, 8], [8, 10], [20, 8], [1, 9], [32, 1],
            [164, 0], [179, 8], [100, 0], [4, 8], [69, 0], [3, 16], [212, 0], [8, 2], [72, 0], [4, 16],
            [129, 0], [363, 4]]
# The take-off at 708 of airspeed, the lowest height after it, the climb's top, and the cable:
# its x, the start's, the deck's two ends, the airspeed and the record's state 7.
expect = [{vblank = 1061, record_state = 0, record_x = 7349, airspeed = 708},
          {vblank = 1110, record_y = 18},
          {vblank = 1300, record_y = 145},
          {vblank = 1900, g_026d3a = 7270, player_start_x = 7032, airspeed = 1148, record_state = 7},
          {vblank = 1900, g_0253fc = 6608, g_0253fe = 7344}]

