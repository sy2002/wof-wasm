# Manifest for tools/extract_tables.py (SPEC.md section 5, step 1).
#
# Every constant table, name list, text and tuning value the port needs comes out of the
# original executable at build time, because hand-written sources hold code only.  An
# entry is (name, kind, address, count); addresses use the fixed load layout of SPEC 3.2,
# so they are the addresses of re/Wings.lst.  The generated sources land in src/gen/ and
# are not versioned.
#
# Kinds
#   names4    a zero-terminated list of 4-character shape names -> uint32_t[count + 1]
#   cstr      one NUL-terminated string                         -> char[]
#   cstrs     `count` NUL-terminated strings, back to back       -> const char *const[count]
#   strptrs   `count` big-endian pointers to strings             -> const char *const[count]
#   words     `count` big-endian 16-bit values                -> uint16_t[count]
#   longs     `count` big-endian 32-bit values                -> uint32_t[count]
#   blob      `count` raw bytes                               -> uint8_t[count]
#   sysfont   topaz 8, located by contents in original/kick.rom (re/notes/system-font.md)

# ---------------------------------------------------------------- shape name lists 3.5
