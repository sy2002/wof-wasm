# ------------------------------------------------------------------------ system font
#
# The load and save dialog, the name entry and the file list draw with graphics.Text and
# never set a font, so the original shows topaz 8 from the Kickstart ROM, which is not on
# the game disk.  The build locates it in original/kick.rom by its contents so that
# another Kickstart version works too, and falls back to the game's own font with a
# message when the ROM is absent (re/notes/system-font.md).

[[table]]
name = "topaz8"
kind = "sysfont"

# ------------------------------------------------------------- the key conversion table
#
# key_to_char runs console.device's RawKeyConvert with the system's default keymap and
# takes the key only when exactly one character comes back (re/notes/keys.md).  The build
# runs the ROM's own routine with the ROM's own keymap, both located by their contents,
# over every raw code and every qualifier combination the shell and the port's key layer
# can produce, and writes the characters as a table.  Without the ROM the table holds what
# the positions of the raw codes give: letters, digits and the space bar.

[[table]]
name = "keymap"
kind = "keymap"

# ----------------------------------------------------------------- the front end 6.2, 6.3
#
# What the screens of re/notes/frontend.md draw with: the two fixed palettes, the rank
# names, the story text and the labels of the dialogs and the high-score list.  The story
# text is a block of NUL-terminated lines that the scroller walks with strlen, and it tests
# the byte after a terminator to decide whether to stretch the line, so it is taken as the
# raw block it is and never written down anywhere (CLAUDE.md).
#
# Kinds added here
#   words   `count` big-endian 16-bit values -> uint16_t[count]
#   blob    `count` raw bytes                -> uint8_t[count]

